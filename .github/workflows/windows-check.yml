name: Windows Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/flying-research-beta
      - feature/automate-list-file-import
      - feature/redbubble-limit-auto-pause
      - feature/redbubble-manual-limit-check
      - feature/auto-png-top-placement
      - feature/wide-top-placement-fix
      - feature/strong-top-placement

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Syntax and release smoke checks
        run: |
          node --check src/main/redbubbleUploadLimitPausePatch.js
          node --check src/main/redbubbleLimitCheckPatch.js
          node --check src/main/backgroundChromeLaunchPatch.js
          node --check src/main/spreadshirtNativeForegroundPatch.js
          node --check src/main/spreadshirtTrueHiddenChromePatch.js
          node --check src/main/spreadshirtPublishBrowserDebugPatch.js
          node --check src/main/spreadshirtForbiddenMetadataRepairPatch.js
          node --check src/main/spreadshirtExactGridPublishProofPatch.js
          node --check src/main/spreadshirtSavePublishActionPatch.js
          node --check src/main/spreadshirtCanonicalDesignIdentityPatch.js
          node --check src/main/spreadshirtAutomationUploadRecoveryPatch.js
          node --check src/main/automationSpreadshirtAttentionPatch.js
          node --check src/main/automationPodTargetsPatch.js
          node --check src/main/automationCapacity50MainPatch.js
          node --check src/main/flyingResearchCacheUiPatch.js
          node --check src/renderer/spreadshirtBetaPolish.js
          node --check src/renderer/automationPodTargetsUi.js
          node --check src/renderer/connectionsExtraServices.js
          node --check src/renderer/flyingResearchCache.js
          node --check src/renderer/automationCapacity50.js
          node --check src/renderer/automationHeaderLock.js
          node --check src/renderer/promptSettings.js
          node --check src/main/taskWorkload.js
          node --check src/main/taskWorkloadSpreadsheet.js
          node --check src/renderer/taskWorkload.js
          node scripts/exportPlacementSmoke.js
          node scripts/spreadshirtCreateNewSmoke.js
          node scripts/spreadshirtNoStatusHandoffSmoke.js
          node scripts/spreadshirtMarketplaceBridgeSmoke.js
          node scripts/spreadshirtForbiddenMetadataSmoke.js
          node scripts/spreadshirtSavePublishActionSmoke.js
          node scripts/spreadshirtHiddenChromeSmoke.js
          node scripts/spreadshirtBetaPolishSmoke.js
          node scripts/automationMultiPodSmoke.js
          node scripts/spreadshirtAutomationRecoverySmoke.js
          node scripts/flyingResearchCacheSmoke.js
          node scripts/automationCapacity50Smoke.js
          node scripts/promptSettingsSmoke.js
          node scripts/taskWorkloadSpreadsheetSmoke.js
          node scripts/taskWorkloadRetrySmoke.js
          npm run check

      - name: Build unpacked Windows package
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload unpacked fast-start artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'feature/flying-research-beta' && 'ZeroPOD-Flying-Research-BETA-Windows-Unpacked' || 'ZeroPOD-Windows-Unpacked' }}
          path: dist/win-unpacked/**
          if-no-files-found: error
